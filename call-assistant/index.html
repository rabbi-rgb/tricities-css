function migrate(o){

async function openStorage(){
 try {db=await new Promise((resolve,reject)=>{let r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(DB_STORE))r.result.createObjectStore(DB_STORE);};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});storage='indexeddb';}

}
function dbGet(){return new Promise((resolve,reject)=>{let t=db.transaction(DB_STORE,'readonly'),q=t.objectStore(DB_STORE).get('state');q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error);});}
function dbPut(o){return new Promise((resolve,reject)=>{let t=db.transaction(DB_STORE,'readwrite');t.objectStore(DB_STORE).put(o,'state');t.oncomplete=()=>resolve();t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error);});}
async function saveState(o){if(storage==='indexeddb')return dbPut(o);const s=JSON.stringify(o);localStorage.setItem(BACKUP_KEY,s);}
async function loadState(){await openStorage();let stored;if(storage==='indexeddb'){try{stored=await dbGet();}catch(e){notice='Unable to read saved data. Try a previously exported backup.';}}else{try{stored=JSON.parse(localStorage.getItem(BACKUP_KEY)||'null');}catch(e){notice='Unable to read local data. Import a backup if you have one.';}}return stored?migrate(stored):freshData();}
async function commit(mutator,message){

 try{await writeLock;return true;}catch(e){console.error('Save failed',e);alert(`The change was NOT saved: ${e.message||e}`);return false;}
}

function doDownload(filename,mime,contents){const blob=new Blob([contents],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
async function handleImport(){if(!importDraft)return;const draft=importDraft;const mode=draft.mode;if(mode==='charidy'&&draft.mapping.actualAmount===''){alert('Choose the column with the ACTUAL amount the donor paid (not the matched campaign total).');return;}
 if(mode==='donor'&&!['fullName','firstName','householdName','email','phonePrimary','crmId'].some(key=>draft.mapping[key]!=='')){alert('Map at least one donor identity field before importing.');return;}
 const stats={inserted:0,updated:0,skipped:0,total:draft.rows.length,unmatched:0};const success=await commit(s=>{
  if(mode==='donor'){for(const row of draft.rows){const parsed=rowDonor(row,draft);if(![parsed.firstName,parsed.lastName,parsed.householdName,parsed.email,parsed.phonePrimary,parsed.crmId].some(Boolean)){stats.skipped++;continue;}
   const identity={first:parsed.firstName,last:parsed.lastName,name:[parsed.firstName,parsed.lastName].filter(Boolean).join(' '),house:parsed.householdName,email:parsed.email,phone:parsed.phonePrimary,crmId:parsed.crmId};const match=matchDonor(identity,s.donors);if(match.ambiguous){stats.skipped++;continue;}let d=match.donor;if(!d){d=blankDonor();s.donors.push(d);stats.inserted++;}else stats.updated++;
   for(const key of ['firstName','lastName','householdName','phonePrimary','phoneSecondary','email','crmId','list','notes','givingHistory']){if(parsed[key]!==''&&parsed[key]!=null){d[key]=parsed[key];}}
   for(const key of ['lastYearCRM','charidy2025SheetActual','askLow','askMedium','askHigh','askRecommended']){if(parsed[key]!==null&&parsed[key]!==undefined){d[key]=parsed[key];if(key==='charidy2025SheetActual')d.charidy2025SheetSource=`Imported from ${draft.filename}`;}}
   for(const key of ['doNotCall','smsOptOut','emailOptOut']){if(draft.mapping[key]!=='')d[key]=parsed[key];}
   d.updatedAt=nowISO();audit(s,d.id,'donor_import',`Updated from ${draft.filename}`);
  }}else{
   for(const row of draft.rows){const r=rowCharidy(row,draft);if(r.actualAmount===null||r.actualAmount<=0){stats.skipped++;continue;}if(r.currency!==s.campaign.currency){r.reviewReason=`Gift currency ${r.currency} differs from campaign ${s.campaign.currency}; verify converted amount`;r.transactionKey=transactionKey(r);if(!s.unmatchedCharidy.some(x=>x.transactionKey===r.transactionKey))s.unmatchedCharidy.push(r);stats.skipped++;stats.unmatched++;continue;}const key=transactionKey(r);if(s.charidyRecords.some(x=>x.transactionKey===key)||s.unmatchedCharidy.some(x=>x.transactionKey===key)){stats.skipped++;continue;}
    r.transactionKey=key;const match=matchDonor({first:r.firstName,last:r.lastName,name:[r.firstName,r.lastName].filter(Boolean).join(' '),house:r.householdName,email:r.email,phone:r.phone},s.donors);
    if(match.donor&&!match.ambiguous){s.charidyRecords.push({id:uid(),donorId:match.donor.id,transactionKey:key,actualAmount:r.actualAmount,matchedDisplayAmount:r.matchedDisplayAmount,currency:r.currency,donatedAt:r.donatedAt,sourceFile:r.sourceFile,importedAt:r.importedAt});stats.updated++;audit(s,match.donor.id,'charidy2025_actual_import',`${money(r.actualAmount,r.currency)} from ${draft.filename}`);}
    else{s.unmatchedCharidy.push(r);stats.unmatched++;stats.skipped++;}
   }
  }
  s.imports.push({id:uid(),at:nowISO(),mode,filename:draft.filename,...stats});audit(s,null,'spreadsheet_import',`${draft.filename}: ${stats.inserted} new, ${stats.updated} updated, ${stats.skipped} unmatched/skipped`);
 },null);
 if(success){importDraft=null;manageTab=mode==='charidy'?'gifts':'import';render();toast(`${stats.inserted} added · ${stats.updated} matched · ${stats.skipped} for review/skipped`);}
}

 if(type==='callback'){if(!f.date){alert('Choose a date.');return;}const when=new Date(`${f.date}T12:00:00`);if(!Number.isFinite(when.getTime())){alert('Choose a valid date.');return;}const ok=await commit(s=>{const d=s.donors.find(x=>x.id===id);d.followUpAt=when.toISOString();d.nextCallAt=d.followUpAt;d.followUpNotes=String(f.notes||'');d.updatedAt=nowISO();audit(s,id,'followup_scheduled',`${f.date} · ${f.notes||''}`);},'Callback saved');if(ok)closeModal();return;}
 if(type==='template'){const templateId=form.dataset.id;if(!f.body){alert('Message body required.');return;}await commit(s=>{const t=s.templates.find(x=>x.id===templateId);if(t){t.body=String(f.body);if(t.channel==='email')t.subject=String(f.subject||'');audit(s,null,'template_edited',templateId);}},'Template saved');closeModal();return;}
 if(type==='matchCharidy'){const rowId=form.dataset.id,donorId=f.donorId;if(!state.donors.some(x=>x.id===donorId)){alert('Select a donor.');return;}const pendingGift=state.unmatchedCharidy.find(x=>x.id===rowId);if(pendingGift?.reviewReason){alert('This gift has a currency mismatch. Please correct the source spreadsheet to a verified CAD amount and import again.');return;}const ok=await commit(s=>{const row=s.unmatchedCharidy.find(x=>x.id===rowId);if(!row)throw Error('Unmatched gift no longer exists');if(s.charidyRecords.some(x=>x.transactionKey===row.transactionKey))throw Error('This transaction has already been linked');s.charidyRecords.push({id:uid(),donorId,transactionKey:row.transactionKey,actualAmount:row.actualAmount,matchedDisplayAmount:row.matchedDisplayAmount,currency:row.currency,donatedAt:row.donatedAt,sourceFile:row.sourceFile,importedAt:row.importedAt});s.unmatchedCharidy=s.unmatchedCharidy.filter(x=>x.id!==rowId);audit(s,donorId,'charidy2025_manual_match',`${money(row.actualAmount)} assigned by user`);},'Gift matched');if(ok)closeModal();return;}
 if(type==='campaign'){if(!String(f.donationUrl||'').startsWith('https://')){alert('Use an HTTPS campaign link.');return;}const goal=number(f.goal);if(goal===null||goal<0){alert('Invalid goal.');return;}const when=new Date(f.endAt);if(!Number.isFinite(when.getTime())){alert('Invalid deadline.');return;}await commit(s=>{Object.assign(s.campaign,{name:String(f.name||''),goal,donationUrl:String(f.donationUrl),endAt:when.toISOString(),mailingAddress:String(f.mailingAddress||''),retryDays:Math.max(1,Number(f.retryDays)||2),maxAttempts:Math.max(1,Number(f.maxAttempts)||3),callerName:String(f.callerName||''),organizationName:String(f.organizationName||'')});audit(s,null,'campaign_settings_edited','Updated campaign config');},'Campaign saved');return;}
 if(type==='delete'){if(String(f.confirm||'')!=='ERASE'){alert('Type ERASE exactly.');return;}const ok=await commit(s=>{Object.keys(s).forEach(k=>delete s[k]);Object.assign(s,freshData());audit(s,null,'local_data_erased','User confirmed full erasure');},'Local data erased');if(ok){modal=null;view='call';importDraft=null;render();}return;}
});
async function start(){try{state=await loadState();render();if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{});if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
 // The countdown is display-only. It cannot send or modify donor records by itself.
 setInterval(()=>{if(view==='call'&&!modal)render();},60000);
 }catch(err){console.error(err);$('app').innerHTML=`<div class="card card-pad" style="margin:30px"><h2>Unable to open saved data</h2><p>${h(err.message||err)}</p><p>Please keep your last downloaded JSON backup. Do not clear site data before recovering it.</p></div>`;}}
start();
// End of app. Core state and all edits remain on the device; external sending is always manual.
