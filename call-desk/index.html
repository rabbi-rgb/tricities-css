function commit(message){try{localStorage.setItem(APP_KEY,JSON.stringify(state));storageOkay=true;}catch(e){storageOkay=false;notify('Changes in memory only. Export a backup to keep them.');}render();if(message)notify(message);}
function notify(s){let el=document.getElementById('toast');if(!el)return;el.textContent=s;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3500);}
function find(id){return state.donors.find(x=>x.id===id);}
const terminal=d=>['pledged','paid','declined','dnc','wrong','exhausted'].includes(d.status)||d.doNotCall;
const due=d=>!d.nextDue||d.nextDue<=today();
function queue(){return state.donors.filter(d=>!terminal(d)&&due(d)).sort((a,b)=>{const priority=d=>(d.nextDue?0:1);return priority(a)-priority(b)||(a.nextDue||'').localeCompare(b.nextDue||'')||Number(Boolean(b.phone))-Number(Boolean(a.phone))||b.mid-a.mid||b.lastYear-a.lastYear;});}
function followDue(){return state.donors.filter(d=>!terminal(d)&&d.nextDue&&d.nextDue<=today()).sort((a,b)=>a.nextDue.localeCompare(b.nextDue));}
function pendingTasks(){return state.donors.flatMap(d=>(d.tasks||[]).filter(t=>t.status==='pending').map(t=>({...t,donorId:d.id,donorName:d.name})));}
function counts(){const pledged=state.donors.flatMap(d=>(d.pledges||[]));return {donors:state.donors.length,source:state.donors.reduce((n,d)=>n+(d.sources||[]).length,0),merged:state.donors.filter(d=>d.sources.length>1).length,review:state.reviews.filter(x=>x.state==='open').length,pledged:pledged.filter(x=>x.status!=='cancelled').reduce((s,x)=>s+Number(x.amount||0),0),paid:pledged.filter(x=>x.status==='paid').reduce((s,x)=>s+Number(x.amount||0),0),calls:state.donors.reduce((s,d)=>s+(d.outcomes||[]).filter(x=>x.type!=='skip').length,0),done:state.donors.filter(terminal).length,missingPhone:state.donors.filter(d=>!num(d.phone)).length};}
const initials=name=>{let v=String(name).split(',').map(x=>x.trim()).filter(Boolean);if(v.length>1)return (v[1][0]||'')+(v[0][0]||'');return v[0]?v[0].split(' ').slice(0,2).map(x=>x[0]).join(''):'?';};
const niceDate=x=>x?new Date(x+'T12:00:00').toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'}):'—';
const dateTime=x=>new Date(x).toLocaleString('en-CA',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
function firstName(d){const s=d.sources[0]||{};let v=s.primaryName||'';if(/foundation|corporation|corp\b|inc\b|software|society|limited|llc/i.test(v))return '';if(v){if(v.includes(','))v=v.split(',')[1].trim();return v.trim().split(/[\s&]+/)[0]||'';}v=d.name;if(/foundation|corp|inc\b|financial|society|software/i.test(v))return '';return v.includes(',')?(v.split(',')[1].trim().split(/\s+/)[0]||''):(v.trim().split(' ')[0]||'');}
const missingMarker=k=>'['+String(k).toUpperCase()+' MISSING]';
function fill(t,d,amount){return String(t||'').replace(/\{([a-z_]+)\}/gi,(m,k)=>{const vals={first_name:firstName(d),amount:amount?fmt(amount):'',campaign_link:state.settings.link,campaign_name:state.settings.name,last_year:d.lastYear?fmt(d.lastYear):''};return vals[k]||missingMarker(k);});}

function callView(){let c=counts(),q=queue(),d=q.find(x=>x.id===ui.selectedId)||q[0];if(!d)return `<div class="page-head"><div class="eyebrow">Campaign calls</div><h1>Welcome to Call Desk.</h1><p>Your donor list stays on this device. Import it to start calling.</p></div><div class="empty-state">${ic('users')}<h3>Bring your donors into Safari</h3><p>Open Backup &amp; restore, select your private donor import file, then tap Restore. Your donor records are not uploaded to this website.</p></div><button class="button button-primary" data-action="section" data-value="backup">Import private donor list</button>`;

return `<div class="page-head"><div class="eyebrow">2026–27 annual campaign</div><h1>One good call at a time.</h1><p>Everything you need to make the next ask, without switching between spreadsheets.</p></div><div class="stat-row"><div class="mini-stat"><strong>${q.filter(x=>num(x.phone)).length}</strong><span>Callable today</span></div><div class="mini-stat"><strong>${c.calls}</strong><span>Outcomes recorded</span></div><div class="mini-stat"><strong>${c.done}</strong><span>Closed out</span></div></div><div class="feature-card"><div class="feature-head"><div class="row-between"><span class="feature-kicker">Up next</span><span class="feature-count">${i} of ${q.length}</span></div><div class="feature-heading"><div class="avatar">${h(initials(d.name))}</div><div style="min-width:0"><h2>${h(d.name)}</h2><div class="feature-sub">${h(summaryLine(d))}</div></div></div><div class="feature-tags">${d.sources.length>1?`<span class="tag tag-gold">${d.sources.length} records merged</span>`:''}${d.nextDue?`<span class="tag tag-blue">Due ${h(niceDate(d.nextDue))}</span>`:`<span class="tag tag-blue">Not yet called</span>`}${!d.phone?`<span class="tag tag-gold">Phone needed</span>`:d.phoneType==='other'?`<span class="tag tag-gold">Confirm mobile before texting</span>`:''}</div></div><div class="feature-body"><div class="quick-ask"><div><span class="label">RECOMMENDED ASK</span><div class="quick-ask-value">${asked(d)?fmt(asked(d)):'Not set'}</div></div><span class="quick-note">${d.attempts?`${d.attempts} previous attempt${d.attempts>1?'s':''}`:'Ready for a personal call'}</span></div><div class="quick-buttons"><button class="button button-gold" data-action="call" data-id="${a(d.id)}" ${!num(d.phone)?'disabled':''}>${ic('phone')} ${d.phone?'Call '+h(fmtPhone(d.phone)):'Phone needed'}</button><button class="button button-primary" data-action="outcome" data-id="${a(d.id)}">${ic('check')} Record result</button></div><div class="gift-grid"><div><span class="gift-label">Last year*</span><div class="gift-amount">${d.lastYear?fmt(d.lastYear):'—'}</div></div><div><span class="gift-label">2 years ago*</span><div class="gift-amount">${d.twoYears?fmt(d.twoYears):'—'}</div></div><div><span class="gift-label">Year to date*</span><div class="gift-amount">${d.ytd?fmt(d.ytd):'—'}</div></div></div><div class="ask-heading"><span class="label">SUGGESTED ASK</span><button class="ghost-link" data-action="open-donor" data-id="${a(d.id)}">View donor history ${ic('arrow')}</button></div><div class="ask-options">${[['low','Low',d.low],['mid','Recommended',d.mid],['high','High',d.high]].map(([k,l,v])=>`<button class="ask-option ${asked(d)===(v||0)&&((d.low===d.mid&&k==='mid')||d.low!==d.mid)?'selected':''}" data-action="choose-ask" data-id="${a(d.id)}" data-amount="${Number(v||0)}"><span>${l}</span><strong>${v?fmt(v):'—'}</strong></button>`).join('')}</div><div class="helper">Suggested amounts are from your spreadsheet, not guaranteed commitments.</div><div class="call-buttons"><button class="button button-ghost" data-action="message" data-id="${a(d.id)}">${ic('message')} Text instead</button><button class="button button-ghost" data-action="script" data-id="${a(d.id)}">${ic('file')} Call script</button></div><div style="display:flex;justify-content:center;gap:26px;flex-wrap:wrap;margin-top:12px"><button class="ghost-link" data-action="skip" data-id="${a(d.id)}">Skip for now</button><button class="ghost-link" data-action="next">Next donor ${ic('arrow')}</button></div>${d.history||d.note?`<div class="notes-strip">${ic('note')}<div><strong>Previous notes</strong><p>${h([d.history,d.note].filter(Boolean).join('\n'))}</p></div></div>`:''}</div></div><p style="margin:15px 5px;font-size:11px;color:#8e969b">* Historical amounts combine source records where merged and have not been reconciled against live payments.</p>`;}
function followView(){const dueList=followDue(),pending=pendingTasks();let l=ui.followTab==='due';return `<div class="page-head"><div class="eyebrow">Stay on top of it</div><h1>Follow-ups</h1><p>The people to get back to and the little things to finish after a call.</p></div><div class="stat-row"><div class="mini-stat"><strong>${dueList.length}</strong><span>Due to contact</span></div><div class="mini-stat"><strong>${pending.length}</strong><span>Open tasks</span></div><div class="mini-stat"><strong>${state.donors.filter(d=>d.nextDue&&d.nextDue>today()&&!terminal(d)).length}</strong><span>Upcoming</span></div></div><div class="filters"><button class="filter ${l?'active':''}" data-action="follow-tab" data-value="due">Due now (${dueList.length})</button><button class="filter ${!l?'active':''}" data-action="follow-tab" data-value="pending">Pending (${pending.length})</button></div>${l?(dueList.length?`<div class="list-stack">${dueList.map(d=>personRow(d,`Due ${niceDate(d.nextDue)} · ${d.attempts} attempts`)).join('')}</div>`:empty('Nothing due yet','Callbacks and retries will appear here automatically.')):(pending.length?`<div class="list-stack">${pending.map(t=>`<div class="list-person"><div class="initial">${t.kind==='message'?ic('message'):ic('heart')}</div><div class="person-middle"><strong>${h(t.donorName)}</strong><p>${t.kind==='message'?'Message ready to review':`Payment to follow up · ${fmt(t.amount)}`}</p></div><button class="button button-small button-ghost" data-action="task" data-id="${a(t.donorId)}" data-task="${a(t.id)}">Review</button></div>`).join('')}</div>`:empty('All tasks are handled','New pledges will generate payment and message follow-ups here.'))}`;}

function empty(title,subtitle){return `<div class="empty-state"><div class="empty-icon">${ic('check')}</div><h3>${h(title)}</h3><p>${h(subtitle)}</p></div>`;}
function donorsView(){const c=counts();const search=ui.search.toLowerCase().trim();let arr=state.donors.filter(d=>{const m=[d.name,...d.aliases,...d.emails,...d.phones,...d.sources.map(s=>s.sourceId)].join(' ').toLowerCase().includes(search);return m&&(ui.donorFilter==='all'||(ui.donorFilter==='missing'&&!num(d.phone))||(ui.donorFilter==='merged'&&d.sources.length>1)||(ui.donorFilter==='pledged'&&(d.status==='pledged'||d.status==='paid'))||(ui.donorFilter==='ready'&&!terminal(d)));});arr.sort((a,b)=>b.mid-a.mid||a.name.localeCompare(b.name));return `<div class="page-head"><div class="eyebrow">Your relationships</div><h1>Donors & households</h1><p>${c.source} spreadsheet records organized into ${c.donors} calling households.</p></div><div class="search-wrap">${ic('search')}<input aria-label="Search donors" class="search" id="donorSearch" placeholder="Search name, phone or email…" value="${a(ui.search)}" autocomplete="off"></div><div class="filters">${[['all','All'],['ready','To call'],['missing','Need phone'],['merged','Merged'],['pledged','Pledged']].map(([id,label])=>`<button class="filter ${ui.donorFilter===id?'active':''}" data-action="donor-filter" data-value="${id}">${label}${id==='missing'?` (${c.missingPhone})`:''}</button>`).join('')}</div><div class="row-between" style="margin:0 3px 12px"><span class="label">${arr.length} HOUSEHOLDS</span><button class="ghost-link" data-action="add-donor">+ Add donor</button></div><div class="list-stack">${arr.slice(0,75).map(d=>personRow(d)).join('')}</div>${arr.length>75?`<p style="margin:17px;text-align:center;font-size:12px;color:#8a939c">Showing first 75. Search to narrow results.</p>`:''}${arr.length===0?empty('No matching donors','Try a different search or filter.'):''}`;}
function dashboardView(){const c=counts(),p=c.pledged/Math.max(1,state.settings.goal)*100,tt=[['New pledges',state.donors.filter(d=>d.pledges.length).length],['No answer',state.donors.reduce((s,d)=>s+d.outcomes.filter(o=>o.type==='noanswer').length,0)],['Voicemails',state.donors.reduce((s,d)=>s+d.outcomes.filter(o=>o.type==='voicemail').length,0)],['Call backs',state.donors.reduce((s,d)=>s+d.outcomes.filter(o=>o.type==='callback').length,0)]];const max=Math.max(1,...tt.map(x=>x[1]));const events=state.activity.slice().reverse().slice(0,8);return `<div class="page-head"><div class="eyebrow">Campaign at a glance</div><h1>Making it happen.</h1><p>Your personal campaign tracker. Only new outcomes entered here count toward totals.</p></div><div class="dashboard-grid"><div class="kpi-card"><div class="label">PLEDGED IN APP</div><div class="value">${fmt(c.pledged)}</div><div class="detail">Entered since importing</div></div><div class="kpi-card"><div class="label">PAID · MANUAL</div><div class="value">${fmt(c.paid)}</div><div class="detail">You confirmed receipt</div></div><div class="kpi-card"><div class="label">CALL OUTCOMES</div><div class="value">${c.calls}</div><div class="detail">Includes retries</div></div><div class="kpi-card"><div class="label">HOUSEHOLDS</div><div class="value">${c.donors}</div><div class="detail">${c.merged} merged households</div></div><div class="kpi-card kpi-wide"><div class="row-between"><h3>Campaign progress</h3><span class="tag tag-gold">${p.toFixed(1)}%</span></div><div class="progress-row"><strong>${fmt(c.pledged)}</strong><span>${fmt(state.settings.goal)} goal</span></div><div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,p)}%"></div></div><p style="font-size:12px;color:#8c949e;margin-top:13px">Remaining to pledge: ${fmt(Math.max(0,state.settings.goal-c.pledged))}</p></div></div><div class="section-title"><h3>Call activity</h3></div><div class="secondary-card">${tt.map(([l,n])=>`<div class="mini-bar-row"><div class="bar-label"><span>${l}</span><strong>${n}</strong></div><div class="mini-bar"><div style="width:${n/max*100}%"></div></div></div>`).join('')}</div><div class="section-title"><h3>Recent activity</h3></div><div class="secondary-card">${events.length?events.map(x=>`<div class="activity-line"><div><p><strong>${h(x.name||'Donor')}</strong> · ${h(x.label)}</p></div><small>${h((x.at||'').slice(0,10))}</small></div>`).join(''):'<p class="subtle small">No outcomes recorded yet.</p>'}</div><div class="info-box" style="margin-top:18px"><strong>Imported figures stay separate</strong>The spreadsheet contains ${state.meta.sourceRows} original records and historical “pledged” notes. These have not been treated as new campaign commitments, and paid amounts are never inferred from giving history.</div>`;}
function moreView(){const c=counts();return `<div class="page-head"><div class="eyebrow">Your call desk</div><h1>Settings & tools</h1><p>Make this work your way, and keep a safe copy of your progress.</p></div><div class="more-grid">${[['reviews','users','Review possible merges',`${c.review} uncertain pairs need your decision`],['settings','settings','Campaign & templates','Goal, messages, scripts and retry rules'],['import','upload','Import donors','Add CSV or Excel records, with a preview'],['backup','download','Backup & restore','Export all progress and donor information'],['help','phone','About this app','How to use on your iPhone and privacy details']].map(([id,icon,title,sub])=>`<button class="more-row" data-action="section" data-value="${id}"><span class="more-icon">${ic(icon)}</span><div><strong>${title}</strong><span>${sub}</span></div><span class="chevron">${ic('chevron')}</span></button>`).join('')}</div><div class="info-box" style="margin-top:22px"><strong>Private local version</strong>This preview keeps data on this browser/device. It does not sign in, sync with ChabadOne, or contact a payment service. Export a backup regularly. Do not upload this donor-filled file to a public website.</div>`;}
function reviewsView(){const pending=state.reviews.filter(x=>x.state==='open');return `<div class="page-head"><div class="eyebrow">Data cleanup</div><h1>Household review</h1><p>Strong matches were already combined. These ${pending.length} pairs may belong together but need your judgment.</p></div><div class="info-box" style="margin-bottom:19px"><strong>Nothing will change in ChabadOne</strong>Merging here affects only this personal working copy. Both original account records remain visible inside the combined household.</div>${pending.length?pending.map(r=>{const da=find(r.a),db=find(r.b);if(!da||!db)return '';return `<div class="review-card"><div class="reason">${h(r.reason)}</div><h3>${h(da.name)} <span style="color:#b2b7bc">&</span> ${h(db.name)}</h3><p>${h(da.address||'Address missing')}${db.address&&db.address!==da.address?' · '+h(db.address):''}</p><div class="inline-buttons"><button class="button button-small button-primary" data-action="approve-merge" data-value="${a(r.id)}">Merge household</button><button class="button button-small button-ghost" data-action="dismiss-merge" data-value="${a(r.id)}">Keep separate</button><button class="button button-small button-light" data-action="open-donor" data-id="${a(da.id)}">Inspect first record</button></div></div>`;}).join(''):empty('All matches reviewed','You can still edit individual donor households from the donor list.')}<button class="ghost-link" data-tab="more">← Back to settings</button>`;}
function settingsView(){let s=state.settings;return `<div class="page-head"><div class="eyebrow">Campaign settings</div><h1>Make it yours.</h1><p>These settings affect your personal calling workflow, not any external platform.</p></div><form id="settingsForm"><div class="panel"><h3>Campaign</h3><div class="field-group"><label class="field-label" for="campaignName">Campaign name</label><input class="field" id="campaignName" value="${a(s.name)}"></div><div class="field-grid"><div class="field-group"><label class="field-label" for="campaignGoal">Goal (CAD)</label><input class="field" id="campaignGoal" type="number" min="0" step="1" value="${Number(s.goal)}"></div><div class="field-group"><label class="field-label" for="campaignLink">Giving link</label><input class="field" id="campaignLink" type="url" placeholder="https://…" value="${a(s.link)}"></div></div><div class="field-grid"><div class="field-group"><label class="field-label" for="retryDays">Retry after (days)</label><input class="field" id="retryDays" type="number" min="1" max="30" value="${Number(s.retryDays)}"></div><div class="field-group"><label class="field-label" for="maxTries">Maximum no-answer attempts</label><input class="field" id="maxTries" type="number" min="1" max="20" value="${Number(s.maxTries)}"></div></div></div><div class="panel"><h3>Call script</h3><textarea class="field textarea" rows="9" id="scriptTemplate">${h(s.script)}</textarea><p class="input-caption">Fill-ins: {first_name}, {amount}, {campaign_link}. Missing values become visible markers.</p></div><div class="panel"><h3>Message templates</h3>${[['text','Text instead'],['pledgeOnline','Online pledge follow-up'],['pledgeCheck','Cheque pledge follow-up'],['pledgeCard','Card pledge follow-up']].map(([k,l])=>`<div class="field-group"><label class="field-label" for="tpl-${k}">${l}</label><textarea class="field textarea" rows="4" id="tpl-${k}">${h(s[k])}</textarea></div>`).join('')}</div><button class="button button-primary button-block" type="submit">Save settings</button></form><button class="ghost-link" data-tab="more">← Back to settings</button>`;}
function backupView(){return `<div class="page-head"><div class="eyebrow">Keep your work</div><h1>Backup & restore</h1><p>Your call results live in this browser. Save a backup after every calling session.</p></div><div class="panel"><h3>Export everything</h3><p class="section-intro">Downloads a JSON file with donors, merges, pledges, outcomes, notes, and settings. Treat it as confidential.</p><button class="button button-primary" data-action="export-backup">${ic('download')} Download backup</button></div><div class="panel"><h3>Restore a backup</h3><p class="section-intro">Restoring replaces the current state on this device. Export the current state first.</p><input type="file" class="field" id="restoreFile" accept=".json,application/json"/><button class="button button-ghost" style="margin-top:12px" data-action="restore-backup">Restore selected file</button></div><div class="info-box"><strong>Important privacy note</strong>This Safari edition does not upload your donor records to a server. Your data is saved in this browser on this device only. There is no sign-in, cloud sync, or automatic backup. Keep the private donor import file and any exported backups off public websites, and export a backup after each calling session.</div><button class="ghost-link" data-tab="more">← Back to settings</button>`;}
function helpView(){return `<div class="page-head"><div class="eyebrow">A simple start</div><h1>Using your call desk</h1><p>A personal calling tool, designed for your phone.</p></div><div class="panel"><h3>How to use it</h3><div class="sm-stack" style="font-size:14px;gap:12px"><p><strong>1. Call</strong> opens your phone dialer. The app does not place or record calls.</p><p><strong>2. Record outcome</strong> updates the queue. No answer retries after ${state.settings.retryDays} days, up to ${state.settings.maxTries} attempts.</p><p><strong>3. Follow-ups</strong> shows due callbacks, message drafts, and pledges to collect.</p><p><strong>4. Donors</strong> lets you find people, update their information and inspect merged sources.</p><p><strong>5. Backup</strong> after every session. This version is stored only in your browser.</p></div></div><div class="panel"><h3>Add to your iPhone home screen</h3><p style="font-size:13px;color:#6f7b86">A home-screen install works once the app is hosted privately over HTTPS. In Safari, open the hosted app, tap Share, then Add to Home Screen. Opening a downloaded HTML file directly does not provide a reliable installable app experience.</p></div><div class="info-box"><strong>What this version does not do</strong>No multi-user logins, live CRM sync, automated reminders, sending texts or emails, or charging cards. A pledge is not marked paid until you explicitly confirm receiving payment.</div><button class="ghost-link" data-tab="more">← Back to settings</button>`;}
function importView(){return `<div class="page-head"><div class="eyebrow">Bring more names</div><h1>Import donors</h1><p>Select a CSV or Excel workbook. Preview the columns before adding anything to your list.</p></div><div class="panel"><h3>Select a file</h3><input type="file" class="field" id="importFile" accept=".csv,.xlsx,.xlsm,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"/><p class="input-caption">Only the first sheet is used from Excel. This import runs on your device.</p></div>${ui.importRows?importPreview():`<div class="info-box"><strong>Your 2026 donor list is already loaded</strong>${state.meta.sourceRows} source rows are available in this app. A second import will skip matching CRM IDs and obvious duplicates, rather than creating them again.</div>`}<button class="ghost-link" data-tab="more">← Back to settings</button>`;}
function importPreview(){const map=ui.importMap,headers=ui.importHeaders||[];const opts=field=>`<select class="field" data-import-map="${field}"><option value="">— Skip field —</option>${headers.map((v,i)=>`<option value="${i}" ${String(map[field])===String(i)?'selected':''}>${h(v||'(unnamed column)')}</option>`).join('')}</select>`;const fields=[['name','Donor / household name *'],['phone','Phone'],['email','Email'],['lastYear','Last year giving'],['mid','Suggested ask'],['low','Low ask'],['high','High ask'],['history','Notes'],['accountId','CRM Account ID']];return `<div class="panel"><h3>Match columns</h3><p class="section-intro">${ui.importRows.length} data rows found in ${h(ui.importFilename)}. Name is required.</p>${fields.map(([f,l])=>`<div class="field-group"><label class="field-label">${l}</label>${opts(f)}</div>`).join('')}<div class="table-scroll"><table class="source-table"><thead><tr>${headers.slice(0,5).map(x=>`<th>${h(x)}</th>`).join('')}</tr></thead><tbody>${ui.importRows.slice(0,3).map(r=>`<tr>${r.slice(0,5).map(v=>`<td>${h(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><button class="button button-primary button-block" style="margin-top:20px" data-action="apply-import">Add eligible rows</button></div>`;}
function modal(title,sub,body,footer=''){return `<div class="modal-backdrop" id="modalBackdrop"><div role="dialog" aria-modal="true" aria-label="${a(title)}" class="modal"><div class="modal-head"><div><div class="eyebrow" style="margin-bottom:6px">Call Desk</div><h2>${h(title)}</h2>${sub?`<p>${h(sub)}</p>`:''}</div><button class="modal-close" aria-label="Close dialog" data-action="close-modal">×</button></div><div class="modal-content">${body}</div>${footer?`<div class="modal-footer">${footer}</div>`:''}</div></div>`;}
const cancelBtn='<button class="button button-ghost" data-action="close-modal">Cancel</button>';
function outcomeModal(d){const choices=[['noanswer','No answer','phone'],['voicemail','Left voicemail','message'],['pledged','Pledged','heart'],['callback','Call back later','calendar'],['declined','Not interested','x'],['wrong','Wrong number','alert'],['dnc','Do not call','shield']];let type=ui.outcome;let details='';if(type==='pledged')details=`<div class="field-grid"><div class="field-group"><label class="field-label" for="pledgeAmount">Pledge amount (CAD)</label><input class="field" type="number" id="pledgeAmount" min="1" step="0.01" value="${asked(d)||''}" placeholder="Amount"></div><div class="field-group"><label class="field-label" for="pledgeMethod">Payment method</label><select class="field" id="pledgeMethod"><option value="online">Online giving link</option><option value="check">Cheque</option><option value="card">Card on file · follow-up only</option><option value="other">Other / arrange later</option></select></div></div><div class="info-box"><strong>Nothing is charged or sent</strong>Saving a pledge only records your conversation and creates follow-up tasks.</div>`;if(type==='callback')details=`<div class="field-grid"><div class="field-group"><label class="field-label" for="callbackDate">Call back on</label><input class="field" id="callbackDate" type="date" min="${today()}" value="${addDays(today(),1)}"></div><div class="field-group"><label class="field-label" for="callbackTime">Approximate time</label><input class="field" id="callbackTime" type="time" value="14:00"></div></div>`;if(type==='noanswer'||type==='voicemail')details=`<div class="info-box">After saving, this donor will return to the queue in ${state.settings.retryDays} days unless this reaches ${state.settings.maxTries} attempts.</div>`;if(type==='dnc')details=`<div class="info-box"><strong>Do not call</strong>This household will be removed from the calling queue until you explicitly reverse it in donor details.</div>`;
return modal('Record the result',d.name,`<div class="label" style="margin-bottom:11px">HOW DID IT GO?</div><div class="outcome-grid">${choices.map(([v,l,icon])=>`<button class="outcome-choice ${type===v?'active':''}" data-action="choose-outcome" data-value="${v}">${ic(icon)} ${l}</button>`).join('')}</div><div style="margin-top:20px">${details}</div><div class="field-group"><label class="field-label" for="outcomeNotes">Notes from this conversation</label><textarea class="field textarea" rows="3" id="outcomeNotes" placeholder="Optional. What should you remember next time?"></textarea></div>`,`${cancelBtn}<button class="button button-primary" data-action="save-outcome">Save outcome</button>`);}
function skipModal(d){const choices=[1,2,3,7,14];return modal('Skip for now',d.name,`<p class="section-intro">Bring this person back to the top of your queue when you are ready.</p><div class="pill-row">${choices.map(v=>`<button class="pill ${ui.skipDays===v?'active':''}" style="${ui.skipDays===v?'background:#17253a;color:white;border-color:#17253a':''}" data-action="choose-skip" data-value="${v}">${v} ${v===1?'day':'days'}</button>`).join('')}</div><div class="field-group" style="margin-top:19px"><label class="field-label" for="skipCustom">Or choose a date</label><input class="field" type="date" id="skipCustom" min="${addDays(today(),1)}" value="${addDays(today(),ui.skipDays)}" /></div>`,`${cancelBtn}<button class="button button-primary" data-action="save-skip">Skip until then</button>`);}
function scriptModal(d){return modal('Call script',d.name,`<div class="message-preview">${h(fill(state.settings.script,d,asked(d)))}</div><div class="muted-box" style="margin-top:16px">Talk naturally. The script is just a starting point. Edit it anytime under Settings & tools.</div>`,`<button class="button button-primary" data-action="close-modal">Done</button>`);}
function messageModal(d,initialText,kind='text'){const v=ui.messageText||initialText||fill(state.settings.text,d,asked(d));return modal('Review your message',d.name,`<div class="label" style="margin-bottom:10px">NOT SENT · REVIEW BEFORE OPENING MESSAGES</div><textarea aria-label="Message to send" id="messageDraft" class="field textarea" rows="8">${h(v)}</textarea><div class="muted-box" style="margin-top:13px">${d.phoneType==='other'?'Only a general or home number is recorded. Verify a mobile number before texting.':d.phone?'To '+h(fmtPhone(d.phone)):'No valid mobile number. You can copy the message or prepare an email instead.'} Missing details show in [BRACKETS]; fill them in before sending.</div>`,`${cancelBtn}<button class="button button-ghost" data-action="copy-message">Copy</button><button class="button button-gold" data-action="launch-message" data-id="${a(d.id)}" ${!num(d.phone)||d.phoneType==='other'?'disabled':''}>${ic('message')} Open Messages</button>`);}
function donorModal(d){let history=(d.outcomes||[]).slice().reverse().slice(0,8);let email=d.emails?.[0]||'';return modal(d.name,`${d.sources.length} original CRM record${d.sources.length===1?'':'s'} · ${d.phone?fmtPhone(d.phone):'Phone needed'}`,`<div class="field-grid"><div class="field-group"><label class="field-label" for="editName">Display name</label><input class="field" id="editName" value="${a(d.name)}"></div><div class="field-group"><label class="field-label" for="editPhone">Preferred phone</label><input class="field" id="editPhone" inputmode="tel" placeholder="No confirmed number" value="${a(d.phone)}" /></div></div><div class="field-group"><label class="field-label" for="editEmail">Preferred email</label><input class="field" id="editEmail" inputmode="email" value="${a(email)}" placeholder="Email"/></div><div class="field-group"><label class="field-label" for="editNote">My notes</label><textarea class="field textarea" id="editNote" rows="3">${h(d.note||'')}</textarea></div><div class="field-grid"><div class="field-group"><div class="field-label">Previous year (source totals)</div><strong class="serif" style="font-size:24px">${fmt(d.lastYear)}</strong></div><div class="field-group"><div class="field-label">Suggested ask</div><strong class="serif" style="font-size:24px">${d.mid?fmt(d.mid):'—'}</strong></div></div><p style="color:#7f8893;font-size:12px;margin-top:12px">${h(d.address||'No mailing address on file')}</p><div class="inline-buttons" style="margin:16px 0 2px"><button class="button button-small button-ghost" data-action="outcome" data-id="${a(d.id)}">Record outcome</button><button class="button button-small button-ghost" data-action="message" data-id="${a(d.id)}">Prepare text</button><button class="button button-small ${d.doNotCall?'button-ghost':'button-danger'}" data-action="toggle-dnc" data-id="${a(d.id)}">${d.doNotCall?'Allow calls again':'Do not call'}</button></div><hr class="separator"/><div class="row-between"><h3>Original donor records</h3><span class="tag tag-muted">${d.sources.length}</span></div><p style="font-size:11px;color:#8b939d;margin:5px 0 14px">Giving totals are from the imported spreadsheet. Not live payment data.</p><div class="table-scroll"><table class="source-table"><thead><tr><th>Name / ID</th><th>Last year</th></tr></thead><tbody>${d.sources.map(s=>`<tr><td><strong>${h(s.name)}</strong><br/><span style="color:#9299a1;font-size:10px">${h(s.sourceId)}</span>${s.legacyPledge?`<br/><span style="color:#a47c3e;font-size:10px">Older pledge note: ${fmt(s.legacyPledge)}</span>`:''}${s.businessPhoneCandidate?`<br/><span style="color:#a47c3e;font-size:10px">Company number (not confirmed as personal): ${h(fmtPhone(s.businessPhoneCandidate))}</span>`:''}</td><td>${fmt(s.lastYear)}${d.sources.length>1&&s.sourceId!==d.id.slice(2)&&!d.outcomes.length&&!d.pledges.length?`<br/><button class="ghost-link" style="font-size:10px" data-action="split-source" data-id="${a(d.id)}" data-source="${a(s.sourceId)}">Split record</button>`:''}</td></tr>`).join('')}</tbody></table></div><div class="field-label" style="margin-top:18px">Giving history and existing notes</div>${d.history?`<p style="font-size:12px;white-space:pre-wrap;color:#697684">${h(d.history)}</p>`:'<p class="small subtle">No notes in the spreadsheet.</p>'}<div class="field-label" style="margin-top:18px">Recent outcomes</div>${history.length?history.map(o=>`<div class="activity-line"><p>${h(labels[o.type]||o.type)}${o.amount?' · '+fmt(o.amount):''}</p><small>${h(niceDate((o.at||'').slice(0,10)))}</small></div>`).join(''):'<p class="small subtle">Not called in this app yet.</p>'}`,`${cancelBtn}<button class="button button-primary" data-action="save-donor">Save donor details</button>`);}
function taskModal(d,t){if(t.kind==='payment')return modal('Pledge awaiting payment',d.name,`<div class="panel" style="margin:0"><div class="label">PLEDGED</div><div class="serif" style="font-size:35px;margin:8px 0">${fmt(t.amount)}</div><p class="subtle small">${h(t.method||'Payment method not specified')}</p></div><div class="info-box" style="margin-top:15px"><strong>Payment has not been confirmed</strong>This app cannot charge cards or verify receipts. Only mark paid once you have personally confirmed the funds arrived in your processor or bank.</div>`,`${cancelBtn}<button class="button button-primary" data-action="open-paid-confirm" data-id="${a(d.id)}" data-task="${a(t.id)}">Record payment received</button>`);return modal('Message to follow up',d.name,`<p class="section-intro">This draft is waiting to be reviewed and sent from your own phone or email app.</p><div class="message-preview">${h(t.body)}</div>`,`${cancelBtn}<button class="button button-ghost" data-action="complete-task" data-id="${a(d.id)}" data-task="${a(t.id)}">Mark handled</button><button class="button button-primary" data-action="prepare-task-message" data-id="${a(d.id)}" data-task="${a(t.id)}">Prepare message</button>`);}
function paidModal(d,t){return modal('Confirm payment received',d.name,`<div class="label">YOU ARE RECORDING</div><h2 style="font-size:32px;margin:10px 0 19px">${fmt(t.amount)}</h2><div class="info-box"><strong>Manual verification only</strong>The app cannot check bank or card transactions. Check the actual outside service before recording a payment.</div><label style="display:flex;gap:12px;margin-top:20px;align-items:flex-start;font-size:13px"><input type="checkbox" id="paidVerified" style="width:21px;height:21px;flex:none"/> I personally confirmed that this payment was received outside this app.</label>`,`${cancelBtn}<button class="button button-primary" data-action="confirm-paid" data-id="${a(d.id)}" data-task="${a(t.id)}">Record as paid · manual</button>`);}
function addModal(){return modal('Add a donor','Create a new calling record',`<div class="field-group"><label class="field-label" for="newName">Name *</label><input class="field" id="newName" placeholder="Full name or household"></div><div class="field-grid"><div class="field-group"><label class="field-label" for="newPhone">Phone</label><input class="field" id="newPhone" inputmode="tel" placeholder="Optional"></div><div class="field-group"><label class="field-label" for="newEmail">Email</label><input class="field" id="newEmail" placeholder="Optional" inputmode="email"></div></div><div class="field-group"><label class="field-label" for="newAsk">Suggested ask (CAD)</label><input class="field" id="newAsk" type="number" step="1" min="0" placeholder="Optional"></div>`,`${cancelBtn}<button class="button button-primary" data-action="save-new-donor">Add donor</button>`);}
function modalHtml(){const m=ui.modal;if(!m)return '';const d=m.id?find(m.id):null;if(m.type==='add')return addModal();if(!d)return '';switch(m.type){case 'outcome':return outcomeModal(d);case 'skip':return skipModal(d);case 'script':return scriptModal(d);case 'message':return messageModal(d,m.text);case 'donor':return donorModal(d);case 'task':{const t=(d.tasks||[]).find(x=>x.id===m.task);return t?taskModal(d,t):'';}case 'paid':{const t=(d.tasks||[]).find(x=>x.id===m.task);return t?paidModal(d,t):'';}default:return '';}}
function render(){const screens={call:callView,follow:followView,donors:donorsView,dashboard:dashboardView,more:moreView,reviews:reviewsView,settings:settingsView,backup:backupView,help:helpView,import:importView};document.getElementById('app').innerHTML=shell((screens[ui.tab]||callView)());}

function checkUrl(url){try{return url&&/^https?:$/.test(new URL(url).protocol);}catch(e){return !url;}}
function addActivity(d,label){state.activity.push({id:'act-'+Date.now()+'-'+Math.random().toString(36).slice(2),name:d.name,label,at:new Date().toISOString()});}
function recordOutcome(){const d=find(ui.modal.id),type=ui.outcome,notes=document.getElementById('outcomeNotes')?.value.trim()||'';if(!d)return;let evt={id:'out-'+Date.now(),type,at:new Date().toISOString(),notes};if(type==='pledged'){
 const amt=Number(document.getElementById('pledgeAmount').value),method=document.getElementById('pledgeMethod').value;if(!Number.isFinite(amt)||amt<=0){notify('Please enter a valid pledge amount.');return;}evt.amount=amt;evt.method=method;d.status='pledged';d.nextDue=null;d.callbackTime=null;const pid='p-'+Date.now()+'-'+Math.random().toString(36).slice(2,6);d.pledges.push({id:pid,amount:amt,method,status:'pledged',at:evt.at});
 d.tasks.push({id:'task-payment-'+pid,kind:'payment',amount:amt,method,status:'pending',pledgeId:pid,created:evt.at});const key=method==='check'?'pledgeCheck':method==='card'?'pledgeCard':'pledgeOnline';const body=fill(state.settings[key],d,amt);d.tasks.push({id:'task-message-'+pid,kind:'message',body,status:'pending',created:evt.at});
}else if(type==='callback'){
 const dt=document.getElementById('callbackDate').value,t=document.getElementById('callbackTime').value;if(!dt||dt<today()){notify('Choose a valid callback date.');return;}d.nextDue=dt;d.callbackTime=t||'';d.status='callback';evt.callbackDate=dt;evt.callbackTime=t;
}else if(type==='noanswer'||type==='voicemail'){d.attempts+=1;d.nextDue=d.attempts>=Number(state.settings.maxTries)?null:addDays(today(),Number(state.settings.retryDays));d.status=d.attempts>=Number(state.settings.maxTries)?'exhausted':'retry';
}else if(type==='dnc'){d.doNotCall=true;d.status='dnc';d.nextDue=null;
}else if(type==='declined'){d.status='declined';d.nextDue=null;
}else if(type==='wrong'){d.status='wrong';d.nextDue=null;}
if(notes)d.note=[d.note,notes].filter(Boolean).join('\n');d.outcomes.push(evt);addActivity(d,labels[type]+(evt.amount?' · '+fmt(evt.amount):''));ui.modal=null;ui.selectedId=null;commit('Outcome saved.');}
function saveSkip(){const d=find(ui.modal.id),dt=document.getElementById('skipCustom')?.value;if(!d||!dt||dt<=today()){notify('Choose a future date.');return;}d.nextDue=dt;d.status='skipped';d.outcomes.push({type:'skip',at:new Date().toISOString(),nextDue:dt});addActivity(d,'Skipped until '+niceDate(dt));ui.modal=null;ui.selectedId=null;commit('Scheduled for '+niceDate(dt));}
function saveDonor(){const d=find(ui.modal?.id);if(!d)return;const name=document.getElementById('editName').value.trim(),phoneText=document.getElementById('editPhone').value.trim(),email=document.getElementById('editEmail').value.trim().toLowerCase(),note=document.getElementById('editNote').value;if(!name){notify('Name cannot be blank.');return;}if(phoneText&&!num(phoneText)){notify('Phone must have 10 digits (or country code +1).');return;}if(email&&(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))){notify('Enter a valid email address.');return;}const priorPhone=d.phone;d.name=name;d.phone=num(phoneText);if(d.phone!==priorPhone)d.phoneType=d.phone?'manual':'';d.phones=[d.phone,...d.phones.filter(x=>x&&x!==d.phone)].filter(Boolean);d.emails=[email,...d.emails.filter(x=>x&&x!==email)].filter(Boolean);d.note=note;d.flagPhoneReview=!d.phone;addActivity(d,'Contact details edited locally');ui.modal=null;commit('Donor saved locally.');}
function toggleDnc(d){d.doNotCall=!d.doNotCall;d.status=d.doNotCall?'dnc':'ready';d.nextDue=null;addActivity(d,d.doNotCall?'Marked do not call':'Calling allowed again');ui.modal=null;commit(d.doNotCall?'Added to do-not-call list.':'Calling enabled again.');}
function mergeReview(id){const review=state.reviews.find(x=>x.id===id);if(!review||review.state!=='open')return;const da=find(review.a),db=find(review.b);if(!da||!db)return;if(!confirm(`Merge ${da.name} and ${db.name} into one calling household? All original CRM source records will be retained.`))return;
for(const k of ['sources','aliases','members','phones','emails','outcomes','pledges','tasks'])da[k]=[...da[k],...db[k]];for(const k of ['sources','aliases','members','phones','emails'])da[k]=[...new Map(da[k].map((v,i)=>[typeof v==='string'?v:JSON.stringify(v),v])).values()];for(const k of ['lastYear','twoYears','threeYears','ytd','legacyPledge'])da[k]=Number((da[k]+db[k]).toFixed(2));for(const k of ['low','mid','high'])da[k]=Math.max(da[k],db[k]);if(!da.phone&&db.phone){da.phone=db.phone;da.phoneType=db.phoneType||'';}if(!da.address&&db.address)da.address=db.address;da.history=[da.history,db.history].filter(Boolean).join('\n');da.note=[da.note,db.note].filter(Boolean).join('\n');if(db.doNotCall){da.doNotCall=true;da.status='dnc';}else if(db.pledges.length||da.pledges.length){da.status='pledged';da.nextDue=null;}da.merged=true;state.donors=state.donors.filter(d=>d.id!==db.id);for(const r of state.reviews){if(r.a===db.id)r.a=da.id;if(r.b===db.id)r.b=da.id;if(r.a===r.b)r.state='merged';}review.state='merged';addActivity(da,`Household merge approved (${db.sources.length} source record${db.sources.length>1?'s':''})`);commit('Households merged in this app only.');}
function splitSource(d,sourceId){if(!d||d.sources.length<2)return;if(d.outcomes.length||d.pledges.length){notify('This household has call activity. Export a backup before changing its structure.');return;}const s=d.sources.find(x=>x.sourceId===sourceId);if(!s||sourceId===d.id.slice(2)){notify('Keep the primary source with this household. You can split the other records.');return;}if(!confirm(`Separate ${s.name} from ${d.name}? Both records and their giving history will be kept.`))return;const nd=createBlankDonor(s.name,s.phone,s.email,s.mid,s.sourceId);nd.aliases=[s.name];nd.members=[s.primaryName||s.name];nd.phones=[s.phone,s.otherPhone].filter(Boolean);nd.emails=[s.email,s.secondaryEmail].filter(Boolean);nd.address=[s.street,s.city,s.region,s.postal].filter(Boolean).join(', ');for(const k of ['low','mid','high','lastYear','twoYears','threeYears','ytd','legacyPledge'])nd[k]=s[k]||0;nd.history=s.history||'';nd.action=s.action||'';nd.sources=[s];nd.flagPhoneReview=!nd.phone||!!s.phoneReview;nd.sourcePhone=s.phoneSource||'Spreadsheet';nd.phoneType=s.phoneType||'mobile';d.sources=d.sources.filter(x=>x.sourceId!==sourceId);for(const k of ['lastYear','twoYears','threeYears','ytd','legacyPledge'])d[k]=Number((d[k]-(s[k]||0)).toFixed(2));for(const k of ['low','mid','high'])d[k]=Math.max(0,...d.sources.map(x=>x[k]||0));d.aliases=[...new Set(d.sources.map(x=>x.name))];d.members=[...new Set(d.sources.map(x=>x.primaryName).filter(Boolean))];d.phones=[...new Set(d.sources.flatMap(x=>[x.phone,x.otherPhone]).filter(Boolean))];d.emails=[...new Set(d.sources.flatMap(x=>[x.email,x.secondaryEmail]).filter(Boolean))];if(!d.phones.includes(d.phone)){d.phone=d.phones[0]||'';d.phoneType=(d.sources.find(x=>x.phone===d.phone)||{}).phoneType||'';}d.merged=d.sources.length>1;state.donors.push(nd);addActivity(d,'Original source record split into separate household');ui.modal=null;commit('Records separated in this app only.');}
function createBlankDonor(name,phone='',email='',mid=0,sourceId='manual-'+Date.now()){const src={sourceId,name,primaryName:name,phone,phoneSource:phone?'Manually entered':'',email,lastYear:0,twoYears:0,threeYears:0,ytd:0,high:0,mid,low:0,history:'',legacyPledge:0,street:'',city:'',region:'',postal:''};return {id:'h-'+sourceId,name,aliases:[name],members:[name],phone,phones:phone?[phone]:[],emails:email?[email]:[],phoneType:phone?'manual':'',address:'',low:0,mid,high:0,lastYear:0,twoYears:0,threeYears:0,ytd:0,legacyPledge:0,history:'',action:'',sources:[src],merged:false,flagPhoneReview:!phone,flagSharedEmail:false,sourcePhone:'Manual',status:'ready',attempts:0,nextDue:null,callbackTime:null,note:'',outcomes:[],pledges:[],tasks:[],doNotCall:false};}
function saveNew(){let name=document.getElementById('newName')?.value.trim(),p=document.getElementById('newPhone')?.value.trim(),e=document.getElementById('newEmail')?.value.trim().toLowerCase(),ask=Number(document.getElementById('newAsk')?.value||0);if(!name){notify('Donor name is required.');return;}if(p&&!num(p)){notify('Phone must be a valid 10-digit number.');return;}if(!Number.isFinite(ask)||ask<0){notify('Enter a valid ask amount.');return;}const d=createBlankDonor(name,num(p),e,ask);state.donors.push(d);addActivity(d,'Added manually');ui.modal=null;commit('Donor added.');}
function finishTask(d,t){t.status='handled';t.handledAt=new Date().toISOString();addActivity(d,t.kind==='message'?'Message marked handled, not sent by app':'Payment task marked handled');ui.modal=null;commit('Task marked handled.');}
function confirmPaid(d,t){if(!document.getElementById('paidVerified')?.checked){notify('Confirm that you verified payment outside this app.');return;}t.status='paid';t.handledAt=new Date().toISOString();t.manualConfirmation=true;const p=d.pledges.find(x=>x.id===t.pledgeId);if(p){p.status='paid';p.paidRecordedAt=t.handledAt;p.verifiedBy='User confirmation outside app';}if(d.pledges.every(x=>x.status==='paid'))d.status='paid';addActivity(d,'Payment marked received by user · '+fmt(t.amount));ui.modal=null;commit('Recorded as paid (manual confirmation).');}
function download(name,data,type){const file=new Blob([data],{type});const url=URL.createObjectURL(file);const link=document.createElement('a');link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);}

async function restoreBackup(){const f=document.getElementById('restoreFile')?.files?.[0];if(!f){notify('Choose a JSON backup first.');return;}let v;try{v=JSON.parse(await f.text());}catch(e){notify('That is not a valid JSON file.');return;}if(v.app!=='Tri-Cities Call Desk'||!v.state||!Array.isArray(v.state.donors)||!Array.isArray(v.state.reviews)){notify('This is not a compatible Call Desk backup.');return;}if(!confirm('Replace this device’s current donor list, pledges and call history with the backup? This cannot be undone without another backup.'))return;state=v.state;state.settings={...defaults.settings,...state.settings};commit('Backup restored on this device.');}

function parseCSV(input){const out=[],row=[];let field='',quote=false;const s=String(input).replace(/^\uFEFF/,'');for(let i=0;i<s.length;i++){const c=s[i];if(quote){if(c==='"'&&s[i+1]==='"'){field+='"';i++;}else if(c==='"')quote=false;else field+=c;}else{if(c==='"')quote=true;else if(c===','){row.push(field);field='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&s[i+1]==='\n')i++;row.push(field);if(row.some(v=>String(v).trim()))out.push([...row]);row.length=0;field='';}else field+=c;}}row.push(field);if(row.some(v=>String(v).trim()))out.push(row);return out;}
async function readXLSX(file){const buffer=await file.arrayBuffer();const dv=new DataView(buffer);const u=new Uint8Array(buffer);const size=u.length;let end=-1;for(let p=size-22;p>=Math.max(0,size-65557);p--){if(dv.getUint32(p,true)===0x06054b50){end=p;break;}}if(end<0)throw Error('Invalid Excel ZIP file.');let cursor=dv.getUint32(end+16,true);const entries=new Map();const td=new TextDecoder();let limit=0;while(cursor<size-46&&dv.getUint32(cursor,true)===0x02014b50&&limit++<10000){const compression=dv.getUint16(cursor+10,true),packedSize=dv.getUint32(cursor+20,true),fnameSize=dv.getUint16(cursor+28,true),extraSize=dv.getUint16(cursor+30,true),commentSize=dv.getUint16(cursor+32,true),local=dv.getUint32(cursor+42,true),name=td.decode(u.subarray(cursor+46,cursor+46+fnameSize));entries.set(name,{compression,packedSize,local});cursor+=46+fnameSize+extraSize+commentSize;}
async function fetchEntry(path){let t=entries.get(path);if(!t)throw Error(`Workbook part not found: ${path}`);const base=t.local;if(dv.getUint32(base,true)!==0x04034b50)throw Error('Invalid Excel entry.');const dataPos=base+30+dv.getUint16(base+26,true)+dv.getUint16(base+28,true);const bytes=u.subarray(dataPos,dataPos+t.packedSize);if(t.compression===0)return td.decode(bytes);if(t.compression!==8)throw Error('Unsupported Excel compression.');if(typeof DecompressionStream==='undefined')throw Error('This browser cannot read Excel directly. Save as CSV and import that.');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return td.decode(await new Response(stream).arrayBuffer());}
const parser=new DOMParser();const xml=txt=>{let x=parser.parseFromString(txt,'application/xml');if(x.querySelector('parsererror'))throw Error('Invalid workbook XML.');return x;};
const shared=[];if(entries.has('xl/sharedStrings.xml')){const doc=xml(await fetchEntry('xl/sharedStrings.xml'));for(const si of doc.getElementsByTagName('si'))shared.push([...si.getElementsByTagName('t')].map(t=>t.textContent||'').join(''));}
let sheet=entries.has('xl/worksheets/sheet1.xml')?'xl/worksheets/sheet1.xml':[...entries.keys()].filter(x=>/^xl\/worksheets\/sheet\d+\.xml$/.test(x)).sort()[0];if(!sheet)throw Error('No Excel worksheet found.');const doc=xml(await fetchEntry(sheet)),out=[];for(const row of doc.getElementsByTagName('row')){const cells=[];for(const c of row.getElementsByTagName('c')){const ref=c.getAttribute('r')||'',letters=(ref.match(/^[A-Z]+/)||[])[0]||'';let col=0;for(const ch of letters)col=col*26+(ch.charCodeAt(0)-64);col=col?col-1:cells.length;const type=c.getAttribute('t')||'',v=c.getElementsByTagName('v')[0]?.textContent||'';let value=v;if(type==='s')value=shared[Number(v)]??'';else if(type==='inlineStr')value=[...c.getElementsByTagName('t')].map(t=>t.textContent||'').join('');else if(type==='e')value='';else if(type==='b')value=v==='1'?'TRUE':'FALSE';cells[col]=value;}out.push(cells.map(x=>x??''));}
return out.filter(x=>x.some(v=>String(v||'').trim()));}
function smartMap(headers){const m={},norm=x=>String(x||'').toLowerCase().replace(/[^a-z0-9 ]/g,'');const hds=headers.map(norm);const rules={name:[/^name$/,/donor.*name/,/household/],phone:[/primary contact mobile phone/,/^phone$/,/mobile/],email:[/primary contact email/,/^email$/],lastYear:[/last year donation summary/,/last year.*giv/],mid:[/^mid$/,/recommended ask/,/suggested ask/],low:[/^low$/],high:[/^high$/],history:[/^history$/,/^notes?$/],accountId:[/^account id$/,/crm.*id/]};for(const [k,rxs] of Object.entries(rules)){for(const rx of rxs){let j=hds.findIndex(x=>rx.test(x));if(j>=0){m[k]=j;break;}}}return m;}
async function loadImport(file){ui.importRows=null;try{const name=file.name.toLowerCase(),rows=name.endsWith('.csv')?parseCSV(await file.text()):name.endsWith('.xlsx')||name.endsWith('.xlsm')?await readXLSX(file):(()=>{throw Error('Select a CSV or XLSX file.');})();if(rows.length<2)throw Error('No importable records were found.');if(rows.length>10000)throw Error('Please import no more than 10,000 rows at once.');ui.importHeaders=rows[0].map(x=>String(x||''));ui.importRows=rows.slice(1);ui.importFilename=file.name;ui.importMap=smartMap(ui.importHeaders);render();notify('File read on your device. Review the mapping below.');}catch(e){ui.importRows=null;render();notify('Import error: '+e.message);}}
function applyImport(){if(!ui.importRows){notify('Choose a file first.');return;}const m=ui.importMap;if(m.name===undefined){notify('Match the donor name column first.');return;}const IDs=new Set(state.donors.flatMap(d=>d.sources.map(s=>s.sourceId).filter(Boolean)));const keys=new Set(state.donors.map(d=>d.name.trim().toLowerCase()+'|'+(d.emails[0]||'').toLowerCase()));let add=[],skip=0,invalid=0;const reviews=[];const val=(r,k)=>m[k]===undefined?'':String(r[m[k]]??'').trim();const money=v=>{const n=Number(String(v||'').replace(/[,$ ]/g,''));return Number.isFinite(n)&&n>0?n:0;};
for(const row of ui.importRows){let name=val(row,'name'),email=val(row,'email').toLowerCase(),phoneText=val(row,'phone'),phone=num(phoneText),account=val(row,'accountId');if(!name){invalid++;continue;}if(account&&IDs.has(account)){skip++;continue;}const key=name.toLowerCase()+'|'+email;if(keys.has(key)){skip++;continue;}if(phoneText&&!phone){invalid++;continue;}const id=account||'import-'+Date.now()+'-'+add.length;const d=createBlankDonor(name,phone,email,money(val(row,'mid')),id);d.low=money(val(row,'low'));d.high=money(val(row,'high'));d.lastYear=money(val(row,'lastYear'));d.history=val(row,'history');d.sources[0].low=d.low;d.sources[0].high=d.high;d.sources[0].mid=d.mid;d.sources[0].lastYear=d.lastYear;d.sources[0].history=d.history;add.push(d);IDs.add(id);keys.add(key);
// A shared email with a different name is a possible merge, not an automatic duplicate.
if(email){const match=state.donors.find(x=>x.emails.includes(email)&&x.name.toLowerCase()!==name.toLowerCase());if(match)reviews.push({id:'review-import-'+Date.now()+'-'+add.length,a:match.id,b:d.id,reason:'Shared email on import',detail:'Please verify before merging.',state:'open'});}}
if(add.length===0){notify(`Nothing added. ${skip} duplicates skipped; ${invalid} invalid rows.`);return;}state.donors.push(...add);state.reviews.push(...reviews);state.meta.sourceRows+=add.length;state.meta.source='Original 2026 list + '+ui.importFilename;ui.importRows=null;ui.importHeaders=null;ui.importFilename='';commit(`${add.length} donors added. ${skip} duplicates skipped; ${invalid} invalid rows.`);}
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
})();
